# ==============================================================================
# Screen Translator - Файл конфигурации (config.toml)
# Горячие клавиши:
#   Alt + T: Перевести экран / активное окно диалога
#   Alt + S: Выделить прямоугольную область (ROI)
#   Alt + A: Включить / выключить режим авто-перевода
#   Alt + P: Переключить движок (Google -> DeepL -> Gemini -> OpenAI/Groq)
#   Alt + C: Скрыть плашки перевода
#   Alt + Q: Выйти из программы
# ==============================================================================

# Активный провайдер перевода:
# "google"            - Google Translate (бесплатно, без API-ключа)
# "deepl"             - DeepL API (высокая точность + контекст, ключ Free или Pro)
# "gemini"            - Google Gemini AI (контекстный перевод + исправление ошибок OCR + Vision)
# "openai_compatible" - OpenAI или Groq (Llama-4, GPT-4o-mini и др.)
provider = "google"

# Языки перевода (en -> ru для комиксов, манги и игр)
source_lang = "en"
target_lang = "ru"

# Количество предыдущих реплик для сохранения контекста диалога (род персонажа, тон)
context_history_size = 5

# Запасной Vision OCR режим (выключен по умолчанию, чтобы не отправлять картинки без согласия):
# Если локальный WinRT OCR не смог найти текст на сложных мем-шрифтах или граффити,
# и настроен API-ключ Gemini или OpenAI/Groq, кадр отправляется нейросети для прямого распознавания.
vision_fallback = false

# ------------------------------------------------------------------------------
# 1. Настройки DeepL API (https://www.deepl.com/pro-api)
# Для бесплатного тарифа ключ обычно оканчивается на ':fx'
# ------------------------------------------------------------------------------
# deepl_api_key = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx:fx"

# ------------------------------------------------------------------------------
# 2. Настройки Google Gemini AI (https://aistudio.google.com/)
# Рекомендуется: gemini-2.5-flash с прямой поддержкой Vision
# ------------------------------------------------------------------------------
# gemini_api_key = "AIzaSy..."

# ------------------------------------------------------------------------------
# 3. Настройки OpenAI / Groq / OpenRouter API
# Groq API (бесплатно и очень быстро): https://console.groq.com/
# OpenAI API: https://platform.openai.com/
# ------------------------------------------------------------------------------
# openai_api_key = "gsk_..."
openai_base_url = "https://api.groq.com/openai/v1"
openai_model = "meta-llama/llama-4-scout-17b-16e-instruct"

# ------------------------------------------------------------------------------
# Настройки интерфейса и авто-режима
# ------------------------------------------------------------------------------
auto_mode_interval_ms = 1200
font_size = 16
font_family = "Segoe UI"
overlay_bg_alpha = 220
